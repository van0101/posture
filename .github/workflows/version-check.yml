# Makes sure every release has a matching version number and a CHANGELOG entry.
name: Version check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # need the previous commit to compare versions
          persist-credentials: false
      - run: bash .github/scripts/check-version.sh
