plugins {
    id 'com.android.application'
}

// One version for web and Android: read APP_VERSION from the web app's app.js.
def appJs = rootProject.file('../app.js').text
def match = (appJs =~ /APP_VERSION = "(\d+)\.(\d+)\.(\d+)"/)
if (!match.find()) {
    throw new GradleException('APP_VERSION not found in app.js')
}
def vMajor = match.group(1) as int
def vMinor = match.group(2) as int
def vPatch = match.group(3) as int

// Release signing comes from CI secrets. Without them the APK is signed with the debug key.
def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.van0101.posture'
    compileSdk 35

    defaultConfig {
        applicationId 'com.van0101.posture'
        minSdk 26
        targetSdk 35
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName "${vMajor}.${vMinor}.${vPatch}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'posture'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
